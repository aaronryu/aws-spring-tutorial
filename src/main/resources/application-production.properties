# production 프로파일에서는 당연한 얘기지만 실제 유저들이 사용하고있는 데이터베이스를 쓰기에 자동화가 아닌 Flyway 로 DDL 형상관리를 수동으로 꼼꼼히한다
spring.jpa.hibernate.ddl-auto=validate

# IN 절에 들어갈 최대 ID 개수 (보통 100 ~ 1000 사이 설정)
# spring.jpa.properties.hibernate.default_batch_fetch_size=2

# 운영 프로파일로 Production Zone 내 AWS ECS 으로 배포 시 로깅 / 모니터링을 위한 AWS CloudWatch 적용하기 위한 사전 준비
logging.level.root=INFO
logging.file.name=/app/logs/myapp.log
management.endpoints.web.exposure.include=health