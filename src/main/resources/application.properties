spring.application.name=demo

# JPA Dialect 및 JPA 관련 설정
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# JDBC 상 데이터베이스 접속을 위한 DataSource 설정
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:54322/example?useSSL=false}
spring.datasource.username=${DATASOURCE_USERNAME:asac}
spring.datasource.password=${DATASOURCE_PASSWORD:1234}

# AWS SDK 사용하기 위한 엑세스 / 시크릿 키 주입
aws.credentials.access-key=${AWS_ACCESS_KEY_ID}
aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY}
aws.region=${AWS_REGION:ap-northeast-2}